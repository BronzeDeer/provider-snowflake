apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: namespaced-schema
spec:
  description: |
    Verify the namespaced Schema managed resource is created in an ephemeral
    namespace inside a prerequisite Database managed by the same provider,
    reported as Synced and Ready, and removed again. The Database and Schema are
    both applied before any assertion runs; the Schema resolves its
    spec.forProvider.databaseRef once the Database becomes ready, so no ordering
    is required beyond applying before asserting.

    Assumes a running control plane with the provider deployed and the default
    cluster ProviderConfig (snowflake.m.bronze-deer.de/v1beta1, kind
    ClusterProviderConfig, name "default") pointing at valid Snowflake
    credentials.
  concurrent: true
  timeouts:
    apply: 2m
    assert: 5m
    delete: 5m
    error: 2m
  bindings:
  - name: testName
    value: (join('-', ['chainsaw-schema-ns', random('[a-z0-9]{8}')]))
  steps:
  - name: create
    try:
    - apply:
        file: database.yaml
    - apply:
        file: schema.yaml
    - assert:
        file: database-assert.yaml
    - assert:
        file: schema-assert.yaml
    catch:
    - describe:
        apiVersion: database.snowflake.m.bronze-deer.de/v1alpha1
        kind: Database
        namespace: ($namespace)
        name: ($testName)
    - describe:
        apiVersion: schema.snowflake.m.bronze-deer.de/v1alpha1
        kind: Schema
        namespace: ($namespace)
        name: ($testName)
  - name: delete
    try:
    - delete:
        ref:
          apiVersion: schema.snowflake.m.bronze-deer.de/v1alpha1
          kind: Schema
          namespace: ($namespace)
          name: ($testName)
    - delete:
        ref:
          apiVersion: database.snowflake.m.bronze-deer.de/v1alpha1
          kind: Database
          namespace: ($namespace)
          name: ($testName)
    - error:
        file: schema-assert.yaml
    - error:
        file: database-assert.yaml
