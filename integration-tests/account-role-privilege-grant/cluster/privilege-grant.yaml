apiVersion: rbac.snowflake.bronze-deer.de/v1alpha1
kind: ClusterAccountRolePrivilegeGrant
metadata:
  name: ($testName)
  labels:
    chainsaw.snowflake.bronze-deer.de/test-name: ($testName)
spec:
  forProvider:
    accountRoleNameRef:
      name: ($testName)
    onAccount: true
    privileges:
    - CREATE DATABASE
