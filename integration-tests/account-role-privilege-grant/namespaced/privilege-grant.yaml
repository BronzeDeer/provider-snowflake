apiVersion: rbac.snowflake.m.bronze-deer.de/v1alpha1
kind: AccountRolePrivilegeGrant
metadata:
  name: ($testName)
  namespace: ($namespace)
  labels:
    chainsaw.snowflake.bronze-deer.de/test-name: ($testName)
spec:
  forProvider:
    accountRoleNameRef:
      name: ($testName)
    onAccount: true
    privileges:
    - CREATE DATABASE
